<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تحكم يدوي — Robot Dog</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div class="brand">
        <div class="brand-icon">🎮</div>
        <div>
          <h1>التحكم اليدوي</h1>
          <p>Manual Control Pad</p>
        </div>
      </div>
      <a class="back-link" href="index.html">← رجوع للاختيار</a>
    </div>

    <div class="card control-wrap">
      <div id="status" class="status">جاهز — اضغط أي زر لإرسال الأمر</div>

      <div class="control-pad">
        <button class="pad-btn forward" data-command="forward">
          ↑
          <span class="pad-label">forward</span>
        </button>
        <button class="pad-btn left" data-command="left">
          ←
          <span class="pad-label">left</span>
        </button>
        <button class="pad-btn stop" data-command="stop">
          ■
          <span class="pad-label">stop</span>
        </button>
        <button class="pad-btn right" data-command="right">
          →
          <span class="pad-label">right</span>
        </button>
        <button class="pad-btn backward" data-command="backward">
          ↓
          <span class="pad-label">backward</span>
        </button>
      </div>

      <div class="extra-actions">
        <button class="pad-btn sit" data-command="sit">
          🐕
          <span class="pad-label">sit / اجلس</span>
        </button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    const statusEl = document.getElementById('status');

    document.querySelectorAll('[data-command]').forEach((button) => {
      button.addEventListener('click', async () => {
        const command = button.dataset.command;
        setStatus(statusEl, 'جاري الإرسال...');

        try {
          const data = await sendRobotCommand(command);
          setStatus(
            statusEl,
            `تم الإرسال: ${data.button} → ${data.stored_as}`,
            'ok'
          );
        } catch (error) {
          setStatus(statusEl, error.message || 'فشل الاتصال بالسيرفر', 'error');
        }
      });
    });
  </script>
</body>
</html>
